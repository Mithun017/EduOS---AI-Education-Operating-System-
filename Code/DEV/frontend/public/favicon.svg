<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer subtle glowing border ring -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#coreGrad)" stroke-width="6" stroke-opacity="0.3" fill="none"/>

  <!-- Futuristic Orbital Tech Rings -->
  <ellipse cx="256" cy="256" rx="180" ry="80" stroke="url(#coreGrad)" stroke-width="12" stroke-linecap="round" transform="rotate(-30 256 256)" opacity="0.8"/>
  <ellipse cx="256" cy="256" rx="180" ry="80" stroke="url(#accentGrad)" stroke-width="10" stroke-dasharray="20 40 80 40" stroke-linecap="round" transform="rotate(45 256 256)" opacity="0.9"/>

  <!-- Neural Nodes / Dots -->
  <circle cx="120" cy="180" r="14" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="390" cy="330" r="14" fill="#C084FC" filter="url(#glow)"/>
  <circle cx="340" cy="140" r="10" fill="#00F2FE"/>

  <!-- Center Stylized 'eE' / Quantum Book Shield Core -->
  <path d="M 180 170 L 256 125 L 332 170 L 256 215 Z" fill="url(#coreGrad)" filter="url(#glow)"/>
  <path d="M 180 200 L 180 270 C 180 320, 256 365, 256 365 C 256 365, 332 320, 332 270 L 332 200 L 256 245 Z" fill="url(#accentGrad)" opacity="0.95"/>
  <path d="M 256 245 L 256 365" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
</svg>